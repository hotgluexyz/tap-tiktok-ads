[tool.poetry]
name = "tap-tiktok-ads"
version = "0.0.1"
description = "`tap-tiktok-ads` is a Singer tap for TikTok, built with the Hotglue Singer SDK."
authors = ["Gary James"]
keywords = [
    "ELT",
    "TikTok",
]
license = "Apache 2.0"
packages = [{ include = "tap_tiktok_ads" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
requests = "^2.25.1"
hotglue-singer-sdk = "^1.0.3"
python-dateutil = "^2.8.2"
hotglue-etl-exceptions = "^0.1.0"
typing-extensions = "^4.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
tox = "^3.24.4"
ruff = "^0.15.22"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
tap-tiktok-ads = 'tap_tiktok_ads.tap:TapTikTokAds.cli'
