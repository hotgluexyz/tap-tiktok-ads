target-version = "py310"
line-length = 100

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    ".secrets",
    ".vscode",
    "__smoke-tests__",
]

[lint]
extend-select = ["C901"]
ignore = ["E722", "E712"]

[lint.per-file-ignores]
"tap_tiktok_ads/streams.py" = ["RUF012"]
"tap_tiktok_ads/tap.py" = ["RUF012"]

[lint.mccabe]
max-complexity = 12
